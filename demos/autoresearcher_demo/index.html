<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <link rel="icon" href="data:,">
  <title>AutoResearcher · 研究工作台</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#wiki"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>AutoResearcher</strong></a>
      <nav aria-label="研究工作台">
        <div class="nav-label">研究工作台</div>
        <a href="#wiki" data-nav="wiki"><span aria-hidden="true">▤</span>部门经验库</a>
        <a href="#jobs" data-nav="jobs"><span aria-hidden="true">▦</span>实验任务</a>
        <a href="#eval" data-nav="eval"><span aria-hidden="true">◫</span>模型评测</a>
      </nav>
      <div class="environment"><i></i><div><strong>演示环境</strong><small>浏览器本地存储</small></div></div>
    </aside>
    <div class="main">
      <header class="topbar"><div>工作台 <span class="slash">/</span> <strong id="breadcrumb"></strong></div><span class="demo">演示数据</span></header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="form-title">
    <form id="entry-form">
      <div class="dialog-title"><h2 id="form-title">新建经验</h2><button type="button" id="close" class="icon-button" aria-label="关闭">×</button></div>
      <label>标题<input name="title" required maxlength="100"></label>
      <label>分类<input name="tag" required maxlength="28" placeholder="如性能诊断"></label>
      <label>适用条件<textarea name="scope" required rows="2"></textarea></label>
      <label>判断依据<textarea name="method" required rows="3"></textarea></label>
      <label>验收标准<textarea name="acceptance" required rows="2"></textarea></label>
      <label>Wiki 来源链接（可选）<input name="source" type="url" placeholder="https://"></label>
      <p id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存草稿</button></div>
    </form>
  </dialog>
  <p class="toast" id="toast" role="status" hidden></p>
  <script type="module" src="./app.js"></script>
</body>
</html>
