[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-nas-demo"
version = "0.1.0"
description = "Clean-room Agentic NAS demo for Conv1d-based Transformers"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools]
package-dir = {"" = "demos"}

[tool.setuptools.packages.find]
where = ["demos"]
include = ["agentic_nas_demo*"]
